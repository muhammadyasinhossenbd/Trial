<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
</head>
<style>
    .box {
        width: 100px;
        height: 100px;
        border: 2px solid red;
        background-color: pink;
        /* property name | duration | easing function | delay */
        /* transition: width 3s linear 3s, background-color 3s ease-in 2s; */
        /* transition: transform 7s 2s; */
        transition: transform 1s;
    }

    .box:hover {
        /* transform: rotate(70deg); */
        /* width: 400px; */
        /* property name | duration | easing function | delay */
        /* background-color: red; */
        transform: rotate(45deg) scale(1.5) translateX(150px);
    }
</style>

<body>
    <ul>
        <li>Transform : Change the Shape. This is a CSS Style Property name.</li>
        <li>Translate: It is a value of the Transform style Rule. This means you move either X , or Y or both axis</li>
        <li>Transition: How long it will take to do change of the shape or Color </li>
    </ul>
    <div class="box">Box-1</div>
    <div class="box">Box-2</div>
    <div class="box">Box-3</div>

</body>

</html>
