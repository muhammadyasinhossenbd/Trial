<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
    <style>
        body {
            margin-left: 250px;
        }

        .container,
        .inner {
            width: 300px;
            height: 300px;

        }

        .container {
            border: 2px solid steelblue;
            background-color: aquamarine;
        }

        .inner {
            border: 5px solid palevioletred;
            background-color: rgb(134, 37, 118);
            /* transform: scale(0.75, .5); */
            /* transform: rotate(90deg); */
            /* transform: scale(0.5) rotate(45deg) translateX(50px);
            transform: translateX(-300px);
            transform: scale(0.5); */
        }

        .container:hover {
            transform: translateX(-10px);


        }
    </style>



</head>

<body>
    <h2>Explore Transform and Translate</h2>

    <div class="container">Container 1
        <div class="inner">Inner 1</div>
    </div>
    <div class="container">Container 2
        <div class="inner">Inner 2</div>
    </div>
    <div class="container">Container 3
        <div class="inner">Inner 3</div>
    </div>
</body>

</html>
