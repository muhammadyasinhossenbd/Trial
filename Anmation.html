<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        @keyframes ping-pong {
            from {
                left: 0;

            }

            to {
                left: 400px;
                background-color: rebeccapurple;
                color: red;
            }

        }


        .stage {
            width: 600px;
            height: 500px;
            background-color: aquamarine;
            border: 2px solid steelblue;
        }

        .ball {
            margin: 0, auto;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: yellow;
            position: relative;
            /* animation: ping-pong 2s ease-in-out 1s infinite alternate; */
            animation: bounce 3s ease-in-out 1s infinite alternate;

        }


        @keyframes bounce {
            0% {
                top: 0;
                left: 0;
                background-color: yellow;
            }

            25% {
                left: 150px;
                top: 200px;
                background-color: red;
            }

            50% {
                left: 300px;
                top: 0;
                background-color: yellow;


            }

            100% {
                left: 500px;
                top: 200px;
                background-color: red;


            }
        }
    </style>

</head>

<body>
    <h2>Explore Animation</h2>
    <div class="stage">
        <div class="ball">HI MEEMO</div>
    </div>
</body>

</html>
