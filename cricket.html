<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Field</title>
    <style>
        .field {
            height: 500px;
            width: 500px;
            border: 1px solid red;
        }

        img {
            width: 70%;
            height: 50%;
        }

        .field:hover .bat {
            transform: rotate(-60deg);
            transform-origin: top right;
        }

        .ball {
            height: 50px;
            width: 50px;
            border: 2px solid red;
            background-color: red;
            border-radius: 55%;
        }
    </style>
</head>

<body>
    <div class="field">
        <img src="./images/F.jpg" alt="" class="bat">
        <div class="ball"></div>
    </div>
</body>

</html>
