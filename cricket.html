<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Field</title>
    <style>
        .field {
            height: 600px;
            width: 6000px;
            border: 1px solid red;
        }

        img {
            width: 400px;
            height: 400px;
        }

        .field:hover .bat {
            transform: rotate(-60deg);
            transform-origin: top right;
        }

        .field:hover .ball {
            transform: translate(1000px, -500px);

        }


        .ball {
            height: 50px;
            width: 50px;
            background-color: red;
            border-radius: 100%;
            position: relative;
            left: 495px;
            transition: transform 1s ease-out 0.2s;
        }
    </style>
</head>

<body>
    <div class="field">
        <img src="./images/bat.png" class="bat">
        <div class="ball"></div>
    </div>
</body>

</html>
